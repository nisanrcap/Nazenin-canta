<!DOCTYPE html>
<html lang="tr">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<meta name="robots" content="noindex">
	<title>Ürünler · Nazenin Yönetim</title>
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
	<link rel="stylesheet" href="../plugins/font-awesome-4.7.0/css/font-awesome.min.css">
	<link rel="stylesheet" href="../styles/admin.css">
</head>
<body data-admin="products">
	<div class="adm">
		<div id="adm-side"></div>
		<main class="adm-main" id="main">

			<div class="adm-head">
				<h1>Ürünler</h1>
			</div>

			<div class="panel">
				<div class="tbl-wrap">
					<table>
						<caption class="sr-only">Ürün listesi</caption>
						<thead>
							<tr>
								<th>Görsel</th>
								<th>Ürün</th>
								<th>Fiyat</th>
								<th>Stok</th>
								<th>İşlem</th>
							</tr>
						</thead>
						<tbody id="prodRows"></tbody>
					</table>
				</div>
			</div>

			<form class="panel" id="prodForm">
				<h2 id="formTitle">Yeni ürün ekle</h2>

				<div class="grid2">
					<div class="fg">
						<label for="fName">Ürün adı</label>
						<input type="text" id="fName" required>
					</div>
					<div class="fg">
						<label for="fCat">Kategori</label>
						<select id="fCat"></select>
					</div>
				</div>

				<div class="grid3">
					<div class="fg">
						<label for="fPrice">Fiyat (₺)</label>
						<input type="number" id="fPrice" min="0" step="0.01" required>
					</div>
					<div class="fg">
						<label for="fStock">Stok adedi</label>
						<input type="number" id="fStock" min="0" required value="10">
					</div>
					<div class="fg">
						<label for="fRating">Puan (1-5)</label>
						<input type="number" id="fRating" min="1" max="5" value="5">
					</div>
				</div>

				<div class="fg">
					<label for="fDesc">Açıklama</label>
					<textarea id="fDesc" required></textarea>
				</div>

				<div class="fg">
					<label for="fFeat">Özellikler (her satıra bir tane)</label>
					<textarea id="fFeat"></textarea>
				</div>

				<div class="grid2">
					<div class="fg">
						<label for="fImgFile">Görsel yükle (en fazla 3)</label>
						<input type="file" id="fImgFile" accept="image/*" multiple>
						<span class="hint">Görseller otomatik küçültülür. İlk görsel ürün kartında görünür.</span>
						<img id="fImgPrev" class="preview-img" alt="Görsel önizleme" style="display:none">
					</div>
					<div class="fg">
						<label for="fImgPath">veya görsel yolu</label>
						<input type="text" id="fImgPath" placeholder="images/omuz1.jpg">
						<span class="hint">Yükleme yapmazsanız bu yol kullanılır.</span>
					</div>
				</div>

				<button class="btn" type="submit"><i class="fa fa-save"></i> Kaydet</button>
				<button class="btn ghost" type="button" id="btnCancel" style="display:none">Vazgeç</button>
			</form>

		</main>
	</div>
	<script src="../js/urunler.js"></script>
	<script src="../js/admin.js"></script>
</body>
</html>
