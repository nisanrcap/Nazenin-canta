<!DOCTYPE html>
<html lang="tr">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<meta name="robots" content="noindex">
	<title>Duyurular · Nazenin Yönetim</title>
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
	<link rel="stylesheet" href="../plugins/font-awesome-4.7.0/css/font-awesome.min.css">
	<link rel="stylesheet" href="../styles/admin.css">
</head>
<body data-admin="announcements">
	<div class="adm">
		<div id="adm-side"></div>
		<main class="adm-main" id="main">

			<div class="adm-head">
				<h1>Duyurular</h1>
			</div>

			<div class="panel">
				<div class="tbl-wrap">
					<table>
						<caption class="sr-only">Duyuru listesi</caption>
						<thead>
							<tr>
								<th>Resim</th>
								<th>Başlık</th>
								<th>Tarih</th>
								<th>Ek</th>
								<th>İşlem</th>
							</tr>
						</thead>
						<tbody id="annRows"></tbody>
					</table>
				</div>
			</div>

			<form class="panel" id="annForm">
				<h2 id="annFormTitle">Yeni duyuru ekle</h2>

				<div class="grid2">
					<div class="fg">
						<label for="aTitle">Başlık</label>
						<input type="text" id="aTitle" required>
					</div>
					<div class="fg">
						<label for="aDate">Tarih</label>
						<input type="date" id="aDate" required>
					</div>
				</div>

				<div class="fg">
					<label for="aText">İçerik</label>
					<textarea id="aText" required></textarea>
				</div>

				<div class="grid2">
					<div class="fg">
						<label for="aImgFile">Resim yükle</label>
						<input type="file" id="aImgFile" accept="image/*">
						<span class="hint">Resim otomatik küçültülür.</span>
						<img id="aImgPrev" class="preview-img" alt="Resim önizleme" style="display:none">
					</div>
					<div class="fg">
						<label for="aImgPath">veya resim yolu</label>
						<input type="text" id="aImgPath" placeholder="images/promo_1.jpg">
						<span class="hint">Yükleme yapmazsanız bu yol kullanılır.</span>
					</div>
				</div>

				<div class="fg">
					<label for="aFiles">Ek dosyalar (PDF, Word, resim)</label>
					<input type="file" id="aFiles" accept=".pdf,.doc,.docx,image/*" multiple>
					<span class="hint">Dosya başına en fazla 1,5 MB.</span>
					<div class="files-list" id="aFileList"></div>
				</div>

				<button class="btn" type="submit"><i class="fa fa-save"></i> Kaydet</button>
				<button class="btn ghost" type="button" id="annCancel" style="display:none">Vazgeç</button>
			</form>

		</main>
	</div>
	<script src="../js/urunler.js"></script>
	<script src="../js/duyurular.js"></script>
	<script src="../js/admin.js"></script>
</body>
</html>
