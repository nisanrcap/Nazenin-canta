<!DOCTYPE html>
<html lang="tr">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<meta name="robots" content="noindex">
	<title>Yönetici Girişi · Nazenin</title>
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
	<link rel="stylesheet" href="../styles/admin.css">
</head>
<body>
	<main class="login-wrap">
		<div class="login-card">
			<h1 style="font-size:30px;margin-bottom:4px">Nazenin.</h1>
			<p style="color:#6B5A50">Yönetim paneli girişi</p>
			<form id="loginForm">
				<div class="fg">
					<label for="u">Kullanıcı adı</label>
					<input type="text" id="u" autocomplete="username" required>
				</div>
				<div class="fg">
					<label for="p">Şifre</label>
					<input type="password" id="p" autocomplete="current-password" required>
				</div>
				<p id="loginErr" role="alert" style="display:none;color:#B3261E">Kullanıcı adı veya şifre hatalı.</p>
				<button class="btn" type="submit" style="width:100%;justify-content:center">Giriş yap</button>
			</form>
			<p class="hint" style="margin-top:16px">Demo bilgileri: <strong>admin</strong> / <strong>nazenin2026</strong><br>Bu panel sunucu kodu içermez; veriler tarayıcıda saklanır.</p>
			<p style="margin:14px 0 0"><a href="../index.html">← Siteye dön</a></p>
		</div>
	</main>
	<script src="../js/admin.js"></script>
</body>
</html>
