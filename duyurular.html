<!DOCTYPE html>
<html lang="tr">
<head>
<title>Duyurular · Nazenin Çanta</title>
<meta charset="utf-8">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<meta name="description" content="Nazenin Çanta duyuruları ve kampanyaları.">
<meta name="viewport" content="width=device-width, initial-scale=1">

<!-- Google Fonts: Playfair Display + Poppins -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">

<!-- Ic sayfalarin ustundeki banner (.home) product.css icinde tanimli, bu yuzden index.html'in degil urun sayfasinin CSS'ini kullaniyoruz -->
<link rel="stylesheet" type="text/css" href="styles/bootstrap4/bootstrap.min.css">
<link href="plugins/font-awesome-4.7.0/css/font-awesome.min.css" rel="stylesheet" type="text/css">
<link rel="stylesheet" type="text/css" href="styles/product.css">
<link rel="stylesheet" type="text/css" href="styles/product_responsive.css">
<link rel="stylesheet" type="text/css" href="styles/nazenin.css">
</head>
<body>

<div class="super_container">

	<div id="site-header"></div>

	<!-- Duyuru kartları: EN YENİDEN EN ESKİYE sıralı (en üstteki en yeni) -->

	<div class="duyurular">
		<div class="container">
			<div class="row">
				<div class="col text-center">
				</div>
			</div>
			<div class="row">

				<div class="col-md-6 col-lg-4">
					<button type="button" class="duyuru_kart"
						data-baslik="Kasım Fırsatları Başladı: Seçili Çantalarda %20 İndirim"
						data-tarih="10 Kasım 2026"
						data-resim="images/promo_1.jpg"
						data-metin="Kasım ayı boyunca seçili omuz ve el çantalarında %20 indirim sizi bekliyor. İndirim sepette otomatik uygulanır. Kampanya stoklarla sınırlıdır ve diğer kampanyalarla birleştirilemez."
						data-ekler='[{"ad":"kampanya-sartlari.pdf","url":"#"}]'>
						<span class="duyuru_resim"><img src="images/promo_1.jpg" alt=""></span>
						<span class="duyuru_icerik">
							<span class="duyuru_tarih">10 Kasım 2026</span>
							<span class="duyuru_baslik">Kasım Fırsatları Başladı: Seçili Çantalarda %20 İndirim</span>
							<span class="duyuru_detay">Ayrıntılar →</span>
						</span>
					</button>
				</div>

				<div class="col-md-6 col-lg-4">
					<button type="button" class="duyuru_kart"
						data-baslik="Yeni Sezon &quot;Lale&quot; Koleksiyonu Satışta"
						data-tarih="3 Kasım 2026"
						data-resim="images/promo_2.jpg"
						data-metin="İlkbahar renklerinden ilham alan Lale koleksiyonu; clutch, cüzdan ve mini çanta modelleriyle mağazamızda ve internet sitemizde. Lookbook dosyasını aşağıdaki bağlantıdan indirebilirsiniz."
						data-ekler='[{"ad":"lale-lookbook.pdf","url":"#"},{"ad":"lale-urun-listesi.docx","url":"#"}]'>
						<span class="duyuru_resim"><img src="images/promo_2.jpg" alt=""></span>
						<span class="duyuru_icerik">
							<span class="duyuru_tarih">3 Kasım 2026</span>
							<span class="duyuru_baslik">Yeni Sezon "Lale" Koleksiyonu Satışta</span>
							<span class="duyuru_detay">Ayrıntılar →</span>
						</span>
					</button>
				</div>

				<div class="col-md-6 col-lg-4">
					<button type="button" class="duyuru_kart"
						data-baslik="Ücretsiz Kargo Limiti Güncellendi"
						data-tarih="25 Ekim 2026"
						data-resim="images/extra_1.jpg"
						data-metin="Ekim ayı itibarıyla 750 TL ve üzeri alışverişlerde kargo ücretsizdir. Türkiye genelinde siparişler 1–3 iş günü içinde kargoya verilir."
						data-ekler='[]'>
						<span class="duyuru_resim"><img src="images/extra_1.jpg" alt=""></span>
						<span class="duyuru_icerik">
							<span class="duyuru_tarih">25 Ekim 2026</span>
							<span class="duyuru_baslik">Ücretsiz Kargo Limiti Güncellendi</span>
							<span class="duyuru_detay">Ayrıntılar →</span>
						</span>
					</button>
				</div>

				<div class="col-md-6 col-lg-4">
					<button type="button" class="duyuru_kart"
						data-baslik="Atölye Gezisi: Çantalarımız Nasıl Üretiliyor?"
						data-tarih="12 Ekim 2026"
						data-resim="images/newsletter.jpg"
						data-metin="Üniversite öğrencileri ve tasarım meraklıları için ücretsiz atölye gezisi düzenliyoruz. Katılım için kayıt formunu doldurmanız yeterli. Kontenjan 20 kişiyle sınırlıdır."
						data-ekler='[{"ad":"atolye-kayit-formu.docx","url":"#"}]'>
						<span class="duyuru_resim"><img src="images/newsletter.jpg" alt=""></span>
						<span class="duyuru_icerik">
							<span class="duyuru_tarih">12 Ekim 2026</span>
							<span class="duyuru_baslik">Atölye Gezisi: Çantalarımız Nasıl Üretiliyor?</span>
							<span class="duyuru_detay">Ayrıntılar →</span>
						</span>
					</button>
				</div>

				<div class="col-md-6 col-lg-4">
					<button type="button" class="duyuru_kart"
						data-baslik="Bakım Rehberi Yayında: Deri Çantanız Nasıl Temizlenir?"
						data-tarih="28 Eylül 2026"
						data-resim="images/extra_2.jpg"
						data-metin="Çantanızın ömrünü uzatmak için hazırladığımız bakım rehberinde nem, leke ve depolama konusunda pratik ipuçları bulabilirsiniz. Rehber PDF olarak indirilebilir."
						data-ekler='[{"ad":"canta-bakim-rehberi.pdf","url":"#"}]'>
						<span class="duyuru_resim"><img src="images/extra_2.jpg" alt=""></span>
						<span class="duyuru_icerik">
							<span class="duyuru_tarih">28 Eylül 2026</span>
							<span class="duyuru_baslik">Bakım Rehberi Yayında: Deri Çantanız Nasıl Temizlenir?</span>
							<span class="duyuru_detay">Ayrıntılar →</span>
						</span>
					</button>
				</div>

				<div class="col-md-6 col-lg-4">
					<button type="button" class="duyuru_kart"
						data-baslik="Öğrencilere Özel %10 İndirim"
						data-tarih="5 Eylül 2026"
						data-resim="images/product_12.jpg"
						data-metin="Geçerli öğrenci belgesi ile mağazamızdan yapılan alışverişlerde %10 indirim uygulanır. İnternet sitesinden alışverişlerde öğrenci e-posta adresinizi sipariş notuna yazmanız yeterlidir."
						data-ekler='[]'>
						<span class="duyuru_resim"><img src="images/product_12.jpg" alt=""></span>
						<span class="duyuru_icerik">
							<span class="duyuru_tarih">5 Eylül 2026</span>
							<span class="duyuru_baslik">Öğrencilere Özel %10 İndirim</span>
							<span class="duyuru_detay">Ayrıntılar →</span>
						</span>
					</button>
				</div>

			</div>
		</div>
	</div>

	<div id="site-footer"></div>

</div>

<!-- Duyuru ayrıntı penceresi (Bootstrap modal). Tek pencere, kartlara tıklanınca içi doldurulur -->
<div class="modal fade" id="duyuruModal" tabindex="-1" role="dialog" aria-labelledby="duyuruBaslik" aria-hidden="true">
	<div class="modal-dialog modal-lg modal-dialog-centered" role="document">
		<div class="modal-content">
			<div class="modal-header">
				<div>
					<div class="duyuru_tarih" id="duyuruTarih"></div>
					<h2 class="modal-title" id="duyuruBaslik"></h2>
				</div>
				<button type="button" class="close" data-dismiss="modal" aria-label="Kapat"><span aria-hidden="true">&times;</span></button>
			</div>
			<div class="modal-body">
				<img id="duyuruResim" class="duyuru_modal_resim" src="" alt="">
				<p id="duyuruMetin"></p>
				<div id="duyuruEkler"></div>
			</div>
			<div class="modal-footer">
				<button type="button" class="button_kapat" data-dismiss="modal">Kapat</button>
			</div>
		</div>
	</div>
</div>

<script src="js/jquery-3.2.1.min.js"></script>
<script src="styles/bootstrap4/popper.js"></script>
<script src="styles/bootstrap4/bootstrap.min.js"></script>
<script src="plugins/easing/easing.js"></script>
<script src="plugins/parallax-js-master/parallax.min.js"></script>
<!-- layout.js, product_custom.js'ten ÖNCE yüklenmeli -->
<script src="js/layout.js"></script>
<script src="js/product_custom.js"></script>
<script>
	// Karta tıklanınca modal'ı kartın data-* bilgileriyle doldur ve aç
	$(function () {
		$('.duyuru_kart').on('click', function () {
			var d = $(this).data();                       // data-baslik, data-tarih, ... değerlerini okur
			$('#duyuruBaslik').text(d.baslik);
			$('#duyuruTarih').text(d.tarih);
			$('#duyuruResim').attr('src', d.resim).attr('alt', '');
			$('#duyuruMetin').text(d.metin);
			var ekler = $('#duyuruEkler').empty();
			(d.ekler || []).forEach(function (e) {
				ekler.append($('<a class="duyuru_ek" target="_blank" rel="noopener"></a>').attr('href', e.url).text(e.ad));
			});
			$('#duyuruModal').modal('show');
		});
	});
</script>
</body>
</html>
